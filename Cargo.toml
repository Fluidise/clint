[package]
name = "fluidise-clint"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"

[dependencies]
lexopt = "=0.3.2"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
empty_enums = "warn"
match_same_arms = "warn"
needless_borrow = "warn"
needless_continue = "warn"

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

