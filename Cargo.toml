[package]
name = "fluidise-clint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
lexopt = "=0.3.2"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

