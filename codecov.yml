# Configuration Codecov pour fluidise-clint
codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 85%
        threshold: 1%
        if_ci_failed: error

ignore:
  - "tests/**/*"
  - "scripts/**/*"
  - "licenses/**/*"
  - "target/**/*"
  - "**/*.md"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
