name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - name: Require an existing version-matched tag
        id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, re, subprocess, tomllib
          tag = os.environ["TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Expected a stable vMAJOR.MINOR.PATCH tag")
          sha = subprocess.check_output(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          manifest = subprocess.check_output(["git", "show", f"{sha}:Cargo.toml"], text=True)
          if tag != "v" + tomllib.loads(manifest)["package"]["version"]:
              raise SystemExit("Tag and Cargo package version differ")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nsha={sha}\n")
          PYTHON

  candidate:
    needs: source
    name: Candidate (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up packaging Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'

      - name: Install declared Rust toolchain, target and copyright inventory
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          rustup component add rust-docs

      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Test packaging invariants
        run: python -m unittest discover -s tests -p 'test_distribution.py' -v

      - name: Build, package, verify inventory and execute extracted candidate
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/distribution.py prepare --target "$TARGET" --output "$RUNNER_TEMP/clint-distribution"

      - name: Upload candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clint-candidate-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/clint-distribution/*.tar.gz
            ${{ runner.temp }}/clint-distribution/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Official GitHub Release
    needs: [source, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up release validation Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Disclose the approved unsigned release policy
        run: |
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Publisher signing policy for 0.1.0

          These binaries have no publisher signature and are not Apple-notarized.
          SHA256SUMS verifies integrity relative to a trusted checksum, not publisher identity.
          No instructions to bypass operating-system security checks are provided.
          EOF

      - name: Download all candidate archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: release-assets
          pattern: clint-candidate-*
          merge-multiple: true

      - name: Enforce public distribution eligibility
        env:
          TAG: ${{ needs.source.outputs.tag }}
          SOURCE: ${{ needs.source.outputs.sha }}
        run: python scripts/distribution.py verify-release --distribution release-assets --tag "$TAG" --source "$SOURCE"

      - name: Generate consolidated SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          echo "Consolidated checksums:"
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "fluidise-clint $TAG" \
            --notes-file RELEASE_NOTES.md
